<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>API test</title></head>
<body>
<h3 id="status">testing...</h3>
<pre id="out"></pre>
<script>
const API = "https://base44.app/api/apps/6a74dc8dc6a9c9d7bc3ef6d1/functions/khalijApi";
const t0 = Date.now();
fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: "/api/products" }) })
  .then(r => r.text().then(txt => ({ status: r.status, txt })))
  .then(({ status, txt }) => {
    let n = "?";
    try { const d = JSON.parse(txt); n = Array.isArray(d) ? d.length + " products" : txt.slice(0, 120); } catch (e) { n = "NOT JSON: " + txt.slice(0, 120); }
    document.getElementById("status").innerText = "FETCH OK in " + (Date.now() - t0) + "ms — HTTP " + status;
    document.getElementById("out").innerText = n;
  })
  .catch(e => {
    document.getElementById("status").innerText = "FETCH FAILED in " + (Date.now() - t0) + "ms";
    document.getElementById("out").innerText = String(e);
  });
</script>
</body></html>
